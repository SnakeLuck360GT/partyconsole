# Netlify: free static hosting. No server needed, since phones connect to the TV browser peer-to-peer (WebRTC via PeerJS).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Short join link: yoursite.netlify.app/play
[[redirects]]
  from = "/play"
  to = "/controller.html"
  status = 200

# Vite's content-hashed JS/CSS (build.assetsDir in vite.config.js): safe to cache forever.
[[headers]]
  for = "/bundle/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# public/assets/ files keep their names when they change (covers, thumbs, models, word lists), so browsers
# must revalidate them (cheap 304s via ETag) or updated games would never reach returning players.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
